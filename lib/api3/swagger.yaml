openapi: 3.0.0
servers:
  - url: /api/v3
info:
  version: 3.0.5
  title: 血糖みまもり API
  contact:
    name: 株式会社世良
    url: 'https://sera-inc.co.jp'
    email: info@sera-inc.co.jp
  license:
    name: AGPL 3
    url: 'https://www.gnu.org/licenses/agpl.txt'
  description: |-
    血糖みまもりのAPI v3は、1型糖尿病の治療データを交換するための、軽量で認証・認可を備えたHTTP RESTインターフェースです。

    主な環境変数は次のとおりです。

    - セキュリティの切り替え（任意、既定値は`true`）
    <pre>API3_SECURITY_ENABLE=true</pre>
    開発やデバッグでセキュリティ機構を無効にできます。本番環境ではfalseにしないでください。

    - 1回の検索で取得できる記録数の上限
    <pre>API3_MAX_LIMIT=1000</pre>

    - 古い記録の自動削除（任意、既定では`DEVICESTATUS`=60のみ）
    <pre>API3_AUTOPRUNE_DEVICESTATUS=60
    API3_AUTOPRUNE_ENTRIES=365
    API3_AUTOPRUNE_TREATMENTS=120 </pre>
    対象のコレクションと保持日数を指定します。たとえば機器状態を60日間保持し、それ以前を自動削除する設定ができます。

    - 旧形式の記録に対する重複排除（任意、既定値はtrue）
    <pre>API3_DEDUP_FALLBACK_ENABLED=true</pre>
    API v3は`identifier`で同じコレクション内の記録を識別します。同じ`identifier`の記録を`CREATE`すると、既存の記録を`UPDATE`します。
    API v3以外で作成された記録には通常`identifier`がないため、`API3_DEDUP_FALLBACK_ENABLED`を`true`にすると、識別子が等しい場合、または識別子がなく次の条件を満たす場合に重複と判定します。
    <pre>`devicestatus` collection&#58; equal combination of `created_at` and `device`
    `entries` collection&#58;      equal combination of `date` and `type`
    `food` collection&#58;         equal `created_at`
    `profile` collection&#58;      equal `created_at`
    `treatments` collection&#58;   equal combination of `created_at` and `eventType` </pre>

    - `date`と併せて`created_at`を補う設定（任意、既定値はtrue）
    <pre>API3_CREATED_AT_FALLBACK_ENABLED=true</pre>
    API v3の標準形式は出来事の日時を`date`に保存します。旧形式を利用する機能との互換性のため、追加・更新時に`created_at`も自動で設定できます。
tags:
  - name: generic
    description: 各コレクション（devicestatus、entries、food、profile、settings、treatments）に共通する操作
  - name: other
    description: その他の操作
paths:
  '/{collection}':
    parameters:
      - in: path
        name: collection
        description: 操作対象のコレクション
        required: true
        schema:
          $ref: '#/components/schemas/paramCollection'
    get:
      tags:
        - generic
      summary: 検索：コレクションの記録を検索
      operationId: SEARCH
      description: |-
        指定した条件に合う記録を、1つのコレクションから検索します。

        1. 複数の絞り込み条件を組み合わせる
        2. `sort`または`sort$desc`で並べ替える
        3. `limit`と`skip`でページを区切る

        成功するとHTTP 200と、該当する記録のJSON配列を返します。配列が空になる場合もあります。

        APIとコレクションに対する`read`権限が必要です（例：`*:*:read`、`api:*:read`、`*:treatments:read`、`api:treatments:read`）。

        例外として、`settings`コレクションは`admin`権限（`api:settings:admin`）を必要とします。アプリごとの設定を分離し、秘密を保護するためです。アプリの設定へアクセスするには、具体的な識別子が必要です。
      parameters:
        - $ref: '#/components/parameters/filterParams'
        - $ref: '#/components/parameters/sortParam'
        - $ref: '#/components/parameters/sortDescParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/skipParam'
        - $ref: '#/components/parameters/fieldsParam'
      security:
        - jwtoken: []
      responses:
        '200':
          $ref: '#/components/responses/search200'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          $ref: '#/components/responses/406NotAcceptable'
    post:
      tags:
        - generic
      summary: 追加：コレクションに新しい記録を追加
      description: |-
        新しい記録をコレクションへ追加します。通常はHTTP 201と、`Last-Modified`、`Location`ヘッダーを返します。`identifier`は応答本文に含まれ、`Location`ヘッダーからも取得できます。

        `API3_DEDUP_FALLBACK_ENABLED`の説明にある条件で重複と判定された場合は、追加の代わりに既存の記録をPOST本文で更新します。その場合はHTTP 200と`Last-Modified`、正しい`Location`ヘッダーを返します。応答本文には`isDeduplication`=`true`と`deduplicatedIdentifier`も含まれます。

        自動削除が有効な場合は、コレクションの古い記録を自動削除します。

        APIとコレクションに対する`create`権限が必要です。重複した記録を更新する場合は`update`権限も必要です（例：`api:treatments:create`、`api:treatments:update`）。
      requestBody:
        description: 追加する記録のJSON
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentToPost'
      security:
        - jwtoken: []
      responses:
        '200':
          $ref: '#/components/responses/200Deduplication'
        '201':
          $ref: '#/components/responses/201CreatedLocation'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
  '/{collection}/{identifier}':
    parameters:
      - in: path
        name: collection
        description: 操作対象のコレクション
        required: true
        schema:
          $ref: '#/components/schemas/paramCollection'
      - in: path
        name: identifier
        description: 操作対象の記録の識別子
        required: true
        schema:
          $ref: '#/components/schemas/paramIdentifier'
    get:
      tags:
        - generic
      summary: 取得：コレクションから1件の記録を取得
      description: |-
        `identifier`が一致する記録を検索し、HTTP 200または404を返します。

        記録が見つかっても削除済みの場合はHTTP 410を返します。

        `If-Modified-Since`ヘッダーの日時が記録の更新日時より後の場合は、本文なしのHTTP 304を返します。前回の取得以降に記録が更新されていないことを示します。`If-Modified-Since`の日時が`srvModified`以前の場合は、完全な本文とHTTP 200を返します。

        APIとコレクションに対する`read`権限が必要です（例：`api:treatments:read`）。
      parameters:
        - $ref: '#/components/parameters/ifModifiedSinceHeader'
        - $ref: '#/components/parameters/fieldsParam'
      security:
        - jwtoken: []
      responses:
        '200':
          $ref: '#/components/responses/read200'
        '304':
          $ref: '#/components/responses/304NotModified'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          $ref: '#/components/responses/406NotAcceptable'
        '410':
          $ref: '#/components/responses/410Gone'
    put:
      tags:
        - generic
      summary: 更新：コレクション内の記録を置き換え
      description: |-
        通常、`identifier`が一致する記録をリクエスト本文のJSON全体で置き換え、HTTP 200を返します。

        記録が見つかっても削除済みの場合はHTTP 410を返します。

        該当する`identifier`の記録がない場合は、新しい記録を追加します。HTTP 201と`Last-Modified`ヘッダーを返します（`identifier`はパスの値を使います）。

        `If-Unmodified-Since`ヘッダーで、把握している記録の最終更新日時を指定できます。その後に別の利用者がサーバー上で更新していた場合は、HTTP 412を返して更新を取り消します。同時更新による競合を防ぐために使えます。

        自動削除が有効な場合は、コレクションの古い記録を自動削除します。

        APIとコレクションに対する`update`権限、必要に応じて`create`権限が必要です（例：`api:treatments:update`、`api:treatments:create`）。
      parameters:
        - $ref: '#/components/parameters/ifUnmodifiedSinceHeader'
      requestBody:
        description: 更新後の記録のJSON。本文に`identifier`があっても無視します。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentToPost'
      security:
        - jwtoken: []
      responses:
        '200':
          $ref: '#/components/responses/200Ok'
        '201':
          $ref: '#/components/responses/201Created'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '410':
          $ref: '#/components/responses/410Gone'
        '412':
          $ref: '#/components/responses/412PreconditionFailed'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
    patch:
      tags:
        - generic
      summary: 部分更新：コレクション内の記録の一部を変更
      description: |-
        通常、`identifier`が一致する記録を取得し、JSON本文で指定した項目を変更してHTTP 200を返します。

        記録が見つかっても削除済みの場合はHTTP 410を返します。該当する`identifier`がない場合はHTTP 404で終了します。

        `If-Unmodified-Since`ヘッダーで、把握している記録の最終更新日時を指定できます。その後に別の利用者がサーバー上で更新していた場合は、HTTP 412を返して変更を取り消します。同時更新による競合を防ぐために使えます。

        `GET`と`UPDATE`を続けて実行する方法に比べ、差分だけを送る`PATCH`では通信量を減らせます。

        変更時に`modifiedBy`へ認可された利用者の名前を自動で設定します。

        自動削除が有効な場合は、コレクションの古い記録を自動削除します。

        APIとコレクションに対する`update`権限が必要です（例：`api:treatments:update`）。
      parameters:
        - $ref: '#/components/parameters/ifUnmodifiedSinceHeader'
      requestBody:
        description: 更新後の記録のJSON。本文に`identifier`があっても無視します。
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentToPost'
      security:
        - jwtoken: []
      responses:
        '200':
          $ref: '#/components/responses/200Ok'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '410':
          $ref: '#/components/responses/410Gone'
        '412':
          $ref: '#/components/responses/412PreconditionFailed'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
    delete:
      tags:
        - generic
      summary: 削除：コレクション内の記録を削除
      description: |-
        記録がすでに削除済みでも処理は成功します。通常は物理的に消去せず、削除済みとして記録します。特別な場合は`permanent`を指定し、復元できない完全削除にできます。

        自動削除が有効な場合は、コレクションの古い記録を自動削除します。

        APIとコレクションに対する`delete`権限が必要です（例：`api:treatments:delete`）。
      parameters:
        - $ref: '#/components/parameters/permanentParam'
      security:
        - jwtoken: []
      responses:
        '200':
          $ref: '#/components/responses/200Ok'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
  '/{collection}/history':
    parameters:
      - in: path
        name: collection
        description: 操作対象のコレクション
        required: true
        schema:
          $ref: '#/components/schemas/paramCollection'
    get:
      tags:
        - generic
      summary: 履歴：指定日時以降の変更を取得
      operationId: HISTORY
      description: |-
        他のシステムと継続してデータを同期するための操作です。`Last-Modified`で指定した日時以降の追加・更新・削除を、時系列順のJSON配列とHTTP 200で返します。配列内で最大の`srvModified`を`Last-Modified`と`ETag`にも設定し、次の同期に利用できます。`limit`で配列の長さを制限できます。

        削除済みの記録は`isValid`=`false`として含まれます。

        API v3以外で作成した記録では、`entries`の`date`、その他のコレクションの`created_at`を`srvModified`の代わりに使います。

        APIとコレクションに対する`read`権限が必要です（例：`api:treatments:read`）。

        例外として、`settings`コレクションは`admin`権限（`api:settings:admin`）を必要とします。アプリごとの設定を分離し、秘密を保護するためです。設定へアクセスするには、具体的な識別子が必要です。
      parameters:
        - $ref: '#/components/parameters/lastModifiedRequiredHeader'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/fieldsParam'
      security:
        - jwtoken: []
      responses:
        '200':
          $ref: '#/components/responses/history200'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          $ref: '#/components/responses/406NotAcceptable'
  '/{collection}/history/{lastModified}':
    parameters:
      - in: path
        name: collection
        description: 操作対象のコレクション
        required: true
        schema:
          $ref: '#/components/schemas/paramCollection'
      - in: path
        name: lastModified
        description: サーバーの時計を基準にした、変更の取得開始日時（UNIX時刻）。指定値より大きい更新日時を検索し、同じ日時は含めません。
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - generic
      summary: 履歴：指定日時以降の変更を取得
      operationId: HISTORY2
      description: |-
        `Last-Modified`のHTTPヘッダーを使う履歴取得より、ミリ秒の精度を保持できる方式です。

        指定日時より後の変更を厳密に検索し、同じ日時の記録を含めません。そのため、次の取得時に直前の最終記録を重ねて取得せず、継続的な同期に適しています。

        その他の動作は、ヘッダーを使う方式と同じです。
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/fieldsParam'
      security:
        - jwtoken: []
      responses:
        '200':
          $ref: '#/components/responses/history200'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          $ref: '#/components/responses/406NotAcceptable'
  /version:
    get:
      tags:
        - other
      summary: バージョン：現在のバージョン情報を取得
      description: 公開されている操作のため、認証は不要です。
      responses:
        '200':
          description: 取得に成功しました。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /status:
    get:
      tags:
        - other
      summary: 状態：現在のバージョンとAPIの全権限を取得
      description: バージョン情報の公開取得とは異なり、この操作には認可が必要です。
      security:
        - jwtoken: []
      responses:
        '200':
          description: 取得に成功しました。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
  /lastModified:
    get:
      tags:
        - other
      summary: 最終更新：各コレクションの最終更新日時を取得
      operationId: LAST-MODIFIED
      description: |-
        各コレクションを並行して調べ、最後の追加・更新・削除の日時を取得します。旧APIとの互換性のため、`srvModified`に加えて`date`と`created_at`も確認します。

        APIとコレクションに対する`read`権限が必要です（例：`api:treatments:read`）。コレクションごとに権限を確認し、アクセス可能なものだけの日時を返します。
      security:
        - jwtoken: []
      responses:
        '200':
          $ref: '#/components/responses/lastModified200'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
components:
  parameters:
    limitParam:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        default: stored in API3_MAX_LIMIT environment variable (usually 1000)
        example: 100
      description: 結果の配列に含める記録数の上限
    skipParam:
      in: query
      name: skip
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0
      description: 検索結果の先頭から読み飛ばす記録数。ページ区切りに使います。
    sortParam:
      in: query
      name: sort
      schema:
        type: string
      required: false
      description: 昇順の並べ替えに使う項目名。`sort$desc`と同時には指定できません。
    sortDescParam:
      in: query
      name: sort$desc
      schema:
        type: string
      required: false
      description: 降順の並べ替えに使う項目名。`sort`と同時には指定できません。
    permanentParam:
      in: query
      name: permanent
      schema:
        type: boolean
      required: false
      description: trueの場合は復元できない完全削除になり、`HISTORY`にも現れません。通常、この指定は不要です。
    fieldsParam:
      in: query
      name: fields
      schema:
        type: string
        default: _all
      required: false
      examples:
        all:
          value: _all
          summary: すべての項目を返します（既定の動作）。
        customSet:
          value: 'date,insulin'
          summary: dateとinsulinのみを返します。
      description: |-
        応答に含める項目を指定します。項目名の列挙、または定義済みの項目集合を使えます。

        _all：すべての項目（既定値）

        date,insulin：`date`と`insulin`のみ
    filterParams:
      in: query
      name: filter_parameters
      schema:
        type: array
        items:
          type: string
      style: spaceDelimited
      description: |-
        複数の絞り込み条件を指定できます。

        条件名は`<field-name>$<operator>`の形式です。例：`carbs$gt=2`は「carbsが存在し、2より大きい」という条件です。

        指定できる演算子：

        `eq`：等しい。例：`insulin$eq=1.5`
        `ne`：等しくない。例：`insulin$ne=1.5`
        `gt`：より大きい。例：`carbs$gt=30`
        `gte`：以上。例：`carbs$gte=30`
        `lt`：より小さい。例：`carbs$lt=30`
        `lte`：以下。例：`carbs$lte=30`
        `in`：指定した集合に含まれる。例：`type$in=sgv|mbg|cal`
        `nin`：指定した集合に含まれない。例：`eventType$nin=Temp%20Basal|Temporary%20Target`
        `re`：正規表現に一致する。例：`eventType$re=Temp.%2A`

        `date`、`created_at`、`srvModified`、`srvCreated`の絞り込みには、次の3形式を使用できます。
        - UNIX時刻のミリ秒（1525383610088）
        - UNIX時刻の秒（1525383610）
        - タイムゾーンを指定できるISO 8601（'2018-05-03T21:40:10.088Z'または'2018-05-03T23:40:10.088+02:00'）

        日時はUTCのオフセット0と、各項目に合う形式へ正規化して検索されます（`date`は1525383610088、`created_at`は'2018-05-03T21:40:10.088Z'）。
    lastModifiedRequiredHeader:
      in: header
      name: Last-Modified
      schema:
        type: string
      required: true
      description: |-
        サーバーの時計を基準にした、変更の取得開始日時です。形式：

        &lt;day-name&gt;, &lt;day&gt; &lt;month&gt; &lt;year&gt; &lt;hour&gt;&#58;&lt;minute&gt;&#58;&lt;second&gt; GMT

        例：
        <pre>Last-Modified&#58; Wed, 17 Oct 2018 05&#58;13&#58;00 GMT</pre>
    ifModifiedSinceHeader:
      in: header
      name: If-Modified-Since
      schema:
        type: string
      required: false
      description: |-
        サーバーの時計を基準にした、記録の最終更新日時です。形式：

        &lt;day-name&gt;, &lt;day&gt; &lt;month&gt; &lt;year&gt; &lt;hour&gt;&#58;&lt;minute&gt;&#58;&lt;second&gt; GMT

        このヘッダーがある場合、処理の前に値を記録のsrvModifiedと比較します。比較結果によって応答が変わります。srvModifiedもサーバーの時計を基準に設定されます。

        例：
        <pre>If-Modified-Since&#58; Wed, 17 Oct 2018 05&#58;13&#58;00 GMT</pre>
    ifUnmodifiedSinceHeader:
      in: header
      name: If-Unmodified-Since
      schema:
        type: string
      required: false
      description: |-
        サーバーの時計を基準にした、記録の最終更新日時です。形式：

        &lt;day-name&gt;, &lt;day&gt; &lt;month&gt; &lt;year&gt; &lt;hour&gt;&#58;&lt;minute&gt;&#58;&lt;second&gt; GMT

        このヘッダーがある場合、処理の前に値を記録のsrvModifiedと比較します。比較結果によって応答が変わります。srvModifiedもサーバーの時計を基準に設定されます。

        例：
        <pre>If-Unmodified-Since&#58; Wed, 17 Oct 2018 05&#58;13&#58;00 GMT</pre>
  responses:
    200Ok:
      description: 処理が完了しました。
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 200
    200Deduplication:
      description: 重複した既存の記録を更新しました。
      headers:
        Last-Modified:
          $ref: '#/components/schemas/headerLastModified'
        Location:
          $ref: '#/components/schemas/headerLocation'
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 200
              identifier:
                $ref: '#/components/schemas/identifierField'
              isDeduplication:
                $ref: '#/components/schemas/isDeduplicationField'
              deduplicatedIdentifier:
                $ref: '#/components/schemas/deduplicatedIdentifierField'
    201Created:
      description: コレクションに新しい記録を追加しました。
      headers:
        Last-Modified:
          $ref: '#/components/schemas/headerLastModified'
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 201
              identifier:
                $ref: '#/components/schemas/identifierField'
              lastModified:
                $ref: '#/components/schemas/lastModifiedField'
    201CreatedLocation:
      description: コレクションに新しい記録を追加しました。
      headers:
        Last-Modified:
          $ref: '#/components/schemas/headerLastModified'
        Location:
          $ref: '#/components/schemas/headerLocation'
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 201
              identifier:
                $ref: '#/components/schemas/identifierField'
              lastModified:
                $ref: '#/components/schemas/lastModifiedField'
    304NotModified:
      description: If-Modified-Sinceヘッダーで指定した日時以降、記録はサーバー上で更新されていません。
      headers:
        Last-Modified:
          $ref: '#/components/schemas/headerLastModified'
    400BadRequest:
      description: リクエストの形式が正しくありません。必須項目が不足しているか、未対応の項目が指定されています。
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 400
    401Unauthorized:
      description: JWTによる認証に失敗しました。セキュリティ設定により処理を続行できません。
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 401
    403Forbidden:
      description: 安全でないHTTP接続、または認証された利用者に操作権限がないリクエストです。
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 403
    404NotFound:
      description: 指定したコレクションまたは記録が見つかりません。
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 404
    406NotAcceptable:
      description: '`Accept`ヘッダーで指定した形式に対応していません。'
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 406
    412PreconditionFailed:
      description: If-Unmodified-Sinceヘッダーで指定した日時以降、記録はサーバー上で更新されています。
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 412
    410Gone:
      description: 指定した記録は削除済みです。
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 410
    422UnprocessableEntity:
      description: リクエストの形式は正しいものの、サーバーの検証に失敗しました。例：読み取り専用の記録（`isReadOnly=true`）を更新・削除しようとした場合。
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 422
    search200:
      description: 検索に成功しました。条件に合う記録の配列を返します。
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 200
              result:
                $ref: '#/components/schemas/DocumentArray'
        text/csv:
          schema:
            $ref: '#/components/schemas/DocumentArray'
        application/xml:
          schema:
            $ref: '#/components/schemas/DocumentArray'
    read200:
      description: 記録が見つかりました。JSON形式の記録を応答本文に返します。
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 200
              result:
                $ref: '#/components/schemas/Document'
        text/csv:
          schema:
            $ref: '#/components/schemas/Document'
        application/xml:
          schema:
            $ref: '#/components/schemas/Document'
      headers:
        Last-Modified:
          $ref: '#/components/schemas/headerLastModified'
    history200:
      description: 指定した日時以降に変更された記録
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 200
              result:
                $ref: '#/components/schemas/DocumentArray'
        text/csv:
          schema:
            $ref: '#/components/schemas/DocumentArray'
        application/xml:
          schema:
            $ref: '#/components/schemas/DocumentArray'
      headers:
        Last-Modified:
          $ref: '#/components/schemas/headerLastModifiedMaximum'
        ETag:
          $ref: '#/components/schemas/headerEtagLastModifiedMaximum'
    lastModified200:
      description: 取得に成功しました。最終更新日時を返します。
      content:
        application/json:
          schema:
            properties:
              status:
                type: integer
                example: 200
              result:
                $ref: '#/components/schemas/LastModifiedResult'
  schemas:
    headerLocation:
      type: string
      description: |-
        記録の所在を示す相対URL。新しく作成した記録の識別子を取得できます。
        例：/api/v3/treatments/53409478-105f-11e9-ab14-d663bd873d93
    headerLastModified:
      type: string
      description: |-
        サーバー上の記録の最終更新日時。形式：
        '<day-name>, <day> <month> <year> <hour>:<minute>:<second> GMT'
        API v3で追加・更新・削除された記録にのみ対応し、サーバーの時計から生成されます。
        例：'Wed, 17 Oct 2018 05:13:00 GMT'
    headerLastModifiedMaximum:
      type: string
      description: |-
        応答に含まれる記録の`srvModified`の最大値。形式：
        '<day-name>, <day> <month> <year> <hour>:<minute>:<second> GMT'
        例：'Wed, 17 Oct 2018 05:13:00 GMT'
    headerEtagLastModifiedMaximum:
      type: string
      description: |-
        応答に含まれる記録の`srvModified`の最大値。`Last-Modified`とは異なり、ミリ秒の精度を保持します。
        例：'W/"1525383610088"'
    paramCollection:
      type: string
      enum:
        - devicestatus
        - entries
        - food
        - profile
        - settings
        - treatments
      example: treatments
    paramIdentifier:
      type: string
      example: 53409478-105f-11e9-ab14-d663bd873d93
    identifierField:
      description: 追加または更新した記録の識別子
      type: string
      example: 53409478-105f-11e9-ab14-d663bd873d93
    lastModifiedField:
      type: integer
      format: int64
      description: サーバー上の記録の最終更新日時。UNIX時刻のミリ秒（1525383610088）。
      example: 1525383610088
    statusField:
      type: integer
      description: HTTP応答の状態コード。標準のHTTP状態コードを処理できないクライアントのため、応答本文にも含まれます。
      example: 200
    isDeduplicationField:
      type: boolean
      description: 更新対象の重複した記録が見つかったかどうか
      example: true
    deduplicatedIdentifierField:
      type: string
      description: 重複と判定され、更新された元の記録の識別子
      example: abc09478-105f-11e9-ab14-d663bd873d93
    DocumentBase:
      description: すべての記録に共通する形式
      properties:
        identifier:
          description: |-
            コレクション内の記録を識別する必須項目です。

            クライアントでは識別子を作成しないでください。追加時にサーバーが自動で割り当てます。

            サーバーは、`date`、`device`、`eventType`を使って重複した記録を自動で統合できるように識別子を計算します。

            受信した識別子を失わず保存し、他のアプリやシステムでも使えるようにしてください。

            API v3では`identifier`がない記録を取得・指定する際、内部の`_id`を`identifier`として使用します。

            注意：クライアントから変更できません。更新・部分更新はできません。
          type: string
          example: 53409478-105f-11e9-ab14-d663bd873d93
        date:
          type: integer
          format: int64
          description: |-
            記録や出来事が発生した日時。必須です。次の3形式を使えます。
            - UNIX時刻のミリ秒（1525383610088）
            - UNIX時刻の秒（1525383610）
            - タイムゾーンを指定できるISO 8601（'2018-05-03T21:40:10.088Z'または'2018-05-03T23:40:10.088+02:00'）

            日時はUTCのオフセット0へ正規化して保存します。指定されていたUTCオフセットは`utcOffset`に設定します。

            注意：クライアントから変更できません。更新・部分更新はできません。
          example: 1525383610088
        utcOffset:
          type: integer
          description: |-
            出来事の現地時刻のUTCオフセット（分）。受信した記録で直接指定するか、`date`から自動で解析します。

            注意：クライアントから変更できません。更新・部分更新はできません。
          example: 120
        app:
          type: string
          description: |-
            人や機器が最初にこの記録を入力したアプリまたはシステム。

            注意：クライアントから変更できません。更新・部分更新はできません。
          example: xdrip
        device:
          type: string
          description: |-
            データの取得元の機器。必要で安全な場合は製造番号も含めます。

            注意：クライアントから変更できません。更新・部分更新はできません。
          example: dexcom G5
        _id:
          description: 内部で割り当てるデータベースID。サーバー内部専用です。クライアントはidentifierで記録を指定します。
          type: string
          example: 58e9dfbc166d88cc18683aac
        srvCreated:
          type: integer
          format: int64
          description: |-
            サーバーが記録をデータベースへ追加した日時（UNIX時刻のミリ秒）。API v3で追加した記録にのみ含まれます。

            注意：クライアントから変更できません。更新・部分更新はできません。
          example: 1525383610088
        subject:
          type: string
          description: |-
            記録を作成した認証主体の名前。受信したJWTからサーバーが自動で設定します。

            注意：クライアントから変更できません。更新・部分更新はできません。
          example: uploader
        srvModified:
          type: integer
          format: int64
          description: |-
            サーバー上での記録の最終更新日時（UNIX時刻のミリ秒）。API v3で追加・更新・削除した記録にのみ含まれます。

            注意：クライアントから変更できません。更新・部分更新はできません。
          example: 1525383610088
        modifiedBy:
          type: string
          description: |-
            最後に記録を部分更新または削除した認証主体の名前。サーバーが自動で設定します。

            注意：クライアントから変更できません。更新・部分更新はできません。
          example: admin
        isValid:
          type: boolean
          description: |-
            削除済みの記録に対してサーバーが設定する項目です。履歴取得で、API v3で削除した記録にのみ含まれ、値は常にfalseです。

            注意：クライアントから変更できません。更新・部分更新はできません。
          example: false
        isReadOnly:
          type: boolean
          description: |-
            クライアントが設定する変更禁止の指定。`isReadOnly=true`の記録は永久に変更できず、削除もできません。

            変更しようとするとHTTP 422（処理できない内容）を返します。
          example: true
      required:
        - date
        - app
    DeviceStatus:
      description: 1型糖尿病の管理に使う機器の状態
      allOf:
        - $ref: '#/components/schemas/DocumentBase'
        - type: object
          properties:
            some_property:
              type: string
              description: 詳細説明は未記載です。
    Entry:
      description: 血糖測定とCGMの校正記録
      allOf:
        - $ref: '#/components/schemas/DocumentBase'
        - type: object
          properties:
            type:
              type: string
              description: 記録の種類（sgv、mbg、calなど）
            sgv:
              type: number
              description: 血糖測定値。sgvの記録のみ。
            direction:
              type: string
              description: CGMが示す血糖の変化方向。sgvの記録のみ。
              example: '"DoubleDown", "SingleDown", "FortyFiveDown", "Flat", "FortyFiveUp", "SingleUp", "DoubleUp", "NOT COMPUTABLE", "RATE OUT OF RANGE" for xdrip'
            noise:
              type: number
              description: 測定時のノイズの程度。sgvの記録のみ。
              example: 'xdrip: 0, 1, 2=high, 3=high_for_predict, 4=very high, 5=extreme'
            filtered:
              type: number
              description: CGM送信機からの、フィルター処理済みの生データ。sgvの記録のみ。
            unfiltered:
              type: number
              description: CGM送信機からの、フィルター処理前の生データ。sgvの記録のみ。
            rssi:
              type: number
              description: CGM送信機の信号強度。sgvの記録のみ。
            units:
              type: string
              example: '"mg", "mmol"'
              description: 血糖値の単位（mg/dlまたはmmol/l）。指定することを強く推奨します。
    Food:
      description: 食品の栄養情報
      allOf:
        - $ref: '#/components/schemas/DocumentBase'
        - type: object
          properties:
            food:
              type: string
              description: 食品の種類（food、quickpick）
            category:
              type: string
              description: 関連する記録をまとめるグループ名
            subcategory:
              type: string
              description: 第2階層のグループ名
            name:
              type: string
              description: 食品名
            portion:
              type: number
              description: 1食分の量（グラムなど）
            unit:
              type: string
              example: '"g", "ml", "oz"'
              description: 1食分の量を表す単位
            carbs:
              type: number
              description: 1食分の糖質量（グラム）
            fat:
              type: number
              description: 1食分の脂質量（グラム）
            protein:
              type: number
              description: 1食分のたんぱく質量（グラム）
            energy:
              type: number
              description: 1食分のエネルギー（kJ）
            gi:
              type: number
              description: 血糖指数（1：低、2：中、3：高）
            hideafteruse:
              type: boolean
              description: よく使う食品として表示する指定
            hidden:
              type: boolean
              description: よく使う食品として表示する指定
            position:
              type: number
              description: よく使う食品の表示順
            portions:
              type: number
              description: よく使う食品の組み合わせに含める場合の数量倍率
            foods:
              type: array
              description: 組み合わせを構成する食品コレクション内の記録
              items:
                $ref: '#/components/schemas/Food'
    Profile:
      description: 1型糖尿病に関係する体の特性と血糖管理の設定
      allOf:
        - $ref: '#/components/schemas/DocumentBase'
        - type: object
          properties:
            some_property:
              type: string
              description: 詳細説明は未記載です。
    Settings:
      description: |-
        アプリやシステムの設定を保存する記録です。血糖みまもり自体の設定も含められます。バックアップや、複数のクライアント間で共有する保存先として使います。1項目だけ変更するときは、全体を置き換える`UPDATE`より`PATCH`が適しています。

        `identifier`にはアプリ名を指定します（例：`xdrip`、`aaps`）。

        `Settings`コレクションには追加の認可が必要です。このコレクションの`SEARCH`には、`api:settings:admin`などの`admin`権限が必要です。アプリごとの設定を分離するためです。
      allOf:
        - $ref: '#/components/schemas/DocumentBase'
        - type: object
          properties:
            some_property:
              type: string
              description: 詳細説明は未記載です。
    Treatment:
      description: 1型糖尿病の治療記録
      allOf:
        - $ref: '#/components/schemas/DocumentBase'
        - type: object
          properties:
            eventType:
              type: string
              example: '"BG Check", "Snack Bolus", "Meal Bolus", "Correction Bolus", "Carb Correction", "Combo Bolus", "Announcement", "Note", "Question", "Exercise", "Site Change", "Sensor Start", "Sensor Change", "Pump Battery Change", "Insulin Change", "Temp Basal", "Profile Switch", "D.A.D. Alert", "Temporary Target", "OpenAPS Offline", "Bolus Wizard"'
              description: |-
                治療イベントの種類。

                注意：クライアントから変更できません。更新・部分更新はできません。
            glucose:
              type: string
              description: 現在の血糖値。
            glucoseType:
              type: string
              example: '"Sensor", "Finger", "Manual"'
              description: 血糖測定方法（Finger：指先測定、Sensor：センサー）。
            units:
              type: string
              example: '"mg/dl", "mmol/l"'
              description: 血糖値の単位（mg/dlまたはmmol/l）。`glucose`を指定する場合は、単位の指定を強く推奨します。
            carbs:
              type: number
              description: 摂取した糖質量。
            protein:
              type: number
              description: 摂取したたんぱく質量。
            fat:
              type: number
              description: 摂取した脂質量。
            insulin:
              type: number
              description: インスリン量。該当する場合に指定します。
            duration:
              type: number
              description: 継続時間（分）。
            preBolus:
              type: number
              description: 食事開始の何分前にボーラスを投与したか。
            splitNow:
              type: number
              description: コンボボーラスの即時投与部分（%）。
            splitExt:
              type: number
              description: コンボボーラスの延長投与部分（%）。
            percent:
              type: number
              description: 基礎インスリンの変更割合（%）。
            absolute:
              type: number
              description: 基礎インスリンの変更量（単位/時）。
            targetTop:
              type: number
              description: 一時目標の上限。
            targetBottom:
              type: number
              description: 一時目標の下限。
            profile:
              type: string
              description: ポンプを切り替えた先のプロフィール名。
            reason:
              type: string
              description: プロフィールの切り替え理由や、一時目標を設定した理由など。
            notes:
              type: string
              description: 治療記録の説明・メモ。
            enteredBy:
              type: string
              description: 治療記録を入力した人。
    DocumentToPost:
      description: 1件の記録
      type: object
      oneOf:
        - $ref: '#/components/schemas/DeviceStatus'
        - $ref: '#/components/schemas/Entry'
        - $ref: '#/components/schemas/Food'
        - $ref: '#/components/schemas/Profile'
        - $ref: '#/components/schemas/Settings'
        - $ref: '#/components/schemas/Treatment'
      example:
        identifier: 53409478-105f-11e9-ab14-d663bd873d93
        date: 1532936118000
        utcOffset: 120
        carbs: 10
        insulin: 1
        eventType: Snack Bolus
        app: xdrip
        subject: uploader
    Document:
      description: 1件の記録
      xml:
        name: item
      type: object
      oneOf:
        - $ref: '#/components/schemas/DeviceStatus'
        - $ref: '#/components/schemas/Entry'
        - $ref: '#/components/schemas/Food'
        - $ref: '#/components/schemas/Profile'
        - $ref: '#/components/schemas/Settings'
        - $ref: '#/components/schemas/Treatment'
      example:
        identifier: 53409478-105f-11e9-ab14-d663bd873d93
        date: 1532936118000
        utcOffset: 120
        carbs: 10
        insulin: 1
        eventType: Snack Bolus
        srvCreated: 1532936218000
        srvModified: 1532936218000
        app: xdrip
        subject: uploader
        modifiedBy: admin
    DeviceStatusArray:
      description: 記録の配列
      type: array
      items:
        $ref: '#/components/schemas/DeviceStatus'
    EntryArray:
      description: 記録の配列
      type: array
      items:
        $ref: '#/components/schemas/Entry'
    FoodArray:
      description: 記録の配列
      type: array
      items:
        $ref: '#/components/schemas/Food'
    ProfileArray:
      description: 記録の配列
      type: array
      items:
        $ref: '#/components/schemas/Profile'
    SettingsArray:
      description: 設定の配列
      type: array
      items:
        $ref: '#/components/schemas/Settings'
    TreatmentArray:
      description: 記録の配列
      type: array
      items:
        $ref: '#/components/schemas/Treatment'
    DocumentArray:
      type: object
      xml:
        name: items
      oneOf:
        - $ref: '#/components/schemas/DeviceStatusArray'
        - $ref: '#/components/schemas/EntryArray'
        - $ref: '#/components/schemas/FoodArray'
        - $ref: '#/components/schemas/ProfileArray'
        - $ref: '#/components/schemas/SettingsArray'
        - $ref: '#/components/schemas/TreatmentArray'
    Version:
      description: バージョン情報
      type: object
      properties:
        status:
          $ref: '#/components/schemas/statusField'
        result:
          $ref: '#/components/schemas/VersionResult'
    VersionResult:
      type: object
      properties:
        version:
          description: 血糖みまもり全体のバージョン
          type: string
          example: 0.10.2-release-20171201
        apiVersion:
          description: API v3のバージョン
          type: string
          example: 3.0.0
        srvDate:
          description: 現在のサーバー日時（UNIX時刻）
          type: number
          example: 1532936118000
        storage:
          type: object
          properties:
            type:
              description: 保存先のエンジンの種類
              type: string
              example: mongodb
            version:
              description: 保存先のエンジンのバージョン
              type: string
              example: 4.0.6
    Status:
      description: バージョンとAPI権限の情報
      properties:
        status:
          $ref: '#/components/schemas/statusField'
        result:
          $ref: '#/components/schemas/StatusResult'
    StatusResult:
      allOf:
        - $ref: '#/components/schemas/VersionResult'
        - type: object
          properties:
            apiPermissions:
              type: object
              properties:
                devicestatus:
                  type: string
                  example: crud
                entries:
                  type: string
                  example: r
                food:
                  type: string
                  example: crud
                profile:
                  type: string
                  example: r
                treatments:
                  type: string
                  example: crud
    LastModifiedResult:
      description: 最終更新日時の取得結果
      properties:
        srvDate:
          description: 現在の保存サーバー日時（UNIX時刻のミリ秒）。
          type: integer
          format: int64
          example: 1556260878776
        collections:
          type: object
          description: 利用者が読み取れるコレクション。
          properties:
            devicestatus:
              description: 最終更新日時（UNIX時刻のミリ秒）。日時が見つからない場合は`null`。
              type: integer
              format: int64
              example: 1556260760974
            treatments:
              description: 最終更新日時（UNIX時刻のミリ秒）。日時が見つからない場合は`null`。
              type: integer
              format: int64
              example: 1553374184169
            entries:
              description: 最終更新日時（UNIX時刻のミリ秒）。日時が見つからない場合は`null`。
              type: integer
              format: int64
              example: 1556260758768
            profile:
              description: 最終更新日時（UNIX時刻のミリ秒）。日時が見つからない場合は`null`。
              type: integer
              format: int64
              example: 1548524042744
  securitySchemes:
    jwtoken:
      type: http
      scheme: bearer
      description: 一時的なJSON Web Tokenが分かっている場合に使用します。
      bearerFormat: JWT
