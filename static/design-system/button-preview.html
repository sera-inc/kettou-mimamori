<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ボタン操作の検証</title><link rel="stylesheet" href="/design-system/index.css"><link rel="stylesheet" href="/design-system/button.css"></head>
<body><main><h1>ボタンの状態とキーボード操作</h1><button id="solid" class="app-button" data-type="solid-fill">実行する</button><button id="outline" class="app-button" data-type="outline">内容を確認する</button><button id="disabled" disabled>実行できません</button><form id="preview-form"><input id="submit" type="submit" value="保存する"></form><p id="result" role="status" aria-live="polite">まだ操作していません</p></main>
<script>let count=0;document.querySelector('#solid').addEventListener('click',()=>{count++;document.querySelector('#result').textContent='実行回数：'+count;});document.querySelector('#preview-form').addEventListener('submit',event=>{event.preventDefault();document.querySelector('#result').textContent='保存しました';});</script></body></html>
