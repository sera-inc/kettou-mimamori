<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選択欄の検証</title><link rel="stylesheet" href="/design-system/index.css"></head><body><main><h1>選択欄の操作と状態</h1><form id="form"><p><label for="unit">単位（必須）</label><select id="unit" required><option value="">選択してください</option><option value="mg/dl">mg/dL</option><option value="mmol">mmol/L</option></select></p><p><label for="disabled">無効な選択欄</label><select id="disabled" disabled><option>変更できません</option></select></p><p><label for="invalid">確認が必要な選択欄</label><select id="invalid" aria-invalid="true" aria-describedby="error"><option>選択してください</option></select><span id="error">項目を選択してください。</span></p><button id="save" type="submit">保存する</button></form><p id="result" role="status">未保存</p><script>document.querySelector('#form').addEventListener('submit',event=>{event.preventDefault();document.querySelector('#result').textContent=document.querySelector('#unit').value;});</script></main></body></html>
