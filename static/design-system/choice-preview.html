<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選択操作の検証</title><link rel="stylesheet" href="/design-system/index.css"></head><body><main><h1>チェックと単一選択</h1><form id="form"><p><label><input id="notify" type="checkbox" name="notify" value="yes">通知を有効にする</label></p><fieldset><legend>表示単位</legend><label><input id="mgdl" type="radio" name="unit" value="mg/dl" checked>mg/dL</label><label><input id="mmol" type="radio" name="unit" value="mmol">mmol/L</label></fieldset><p><label><input id="disabled" type="checkbox" disabled checked>変更できません</label></p><p><label><input id="partial" type="checkbox">一部が選択されています</label></p><button id="save" type="submit">保存する</button></form><p id="result" role="status">未保存</p><script>document.querySelector('#partial').indeterminate=true;document.querySelector('#form').addEventListener('submit',event=>{event.preventDefault();const data=new FormData(event.target);document.querySelector('#result').textContent=data.get('unit')+' / '+(data.get('notify')||'off');});</script></main></body></html>
