<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入力欄の検証</title><link rel="stylesheet" href="/design-system/index.css"></head>
<body class="app-input-preview"><main><h1>入力欄の操作と状態</h1><form id="preview-form">
<p><label for="name">プロフィール名（必須）</label><input id="name" name="name" required></p>
<p><label for="amount">記録する数値（0〜20、0.1刻み）</label><input id="amount" name="amount" type="number" min="0" max="20" step="0.1" value="0.6" required></p>
<p><label for="date">記録の日付</label><input id="date" type="date" value="2026-10-12"></p><p><label for="time">記録の時刻</label><input id="time" type="time" value="08:30"></p>
<p><label for="readonly">変更できない値</label><input id="readonly" value="読み取り専用" readonly></p><p><label for="disabled">無効な値</label><input id="disabled" value="無効" disabled></p>
<p><label for="invalid">入力エラー</label><input id="invalid" aria-invalid="true" aria-describedby="error" value="確認が必要"><span id="error" class="app-input-error">入力内容を確認してください。</span></p>
<button type="submit" id="save">保存する</button></form><p id="result" role="status">未保存</p></main>
<script>document.querySelector('#preview-form').addEventListener('submit',event=>{event.preventDefault();document.querySelector('#result').textContent=document.querySelector('#name').value+'：'+document.querySelector('#amount').value;});</script></body></html>
