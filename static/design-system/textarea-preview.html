<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記録欄の検証</title><link rel="stylesheet" href="/design-system/index.css"></head><body><main><h1>複数行の記録欄</h1><form id="form"><p><label for="notes">記録（必須、100文字以内）</label><textarea id="notes" required maxlength="100" aria-describedby="hint"></textarea><span id="hint">改行を含めて入力できます。</span></p><p><label for="readonly">読み取り専用</label><textarea id="readonly" readonly>変更できない記録</textarea></p><p><label for="disabled">無効な記録欄</label><textarea id="disabled" disabled>無効</textarea></p><p><label for="invalid">確認が必要な記録</label><textarea id="invalid" aria-invalid="true" aria-describedby="error"></textarea><span id="error">入力内容を確認してください。</span></p><button id="save" type="submit">保存する</button></form><pre id="result" role="status">未保存</pre><script>document.querySelector('#form').addEventListener('submit',event=>{event.preventDefault();document.querySelector('#result').textContent=document.querySelector('#notes').value;});</script></main></body></html>
